name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bunx vite build
      - run: bunx tsup
      # Unit tests only; Cypress component/e2e suites need a browser and are left out.
      - run: bun test src/__tests__/*.test.ts
